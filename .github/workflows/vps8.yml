name: Auto Renew Server Script

on:
  workflow_dispatch:
  schedule:
   - cron: '0 0,8,16 * * *'

jobs:
  run-renew:
    runs-on: ubuntu-latest
    # ==========================================
    # 核心：使用矩阵配置多账号，想加几个账号就在下面的方括号里写几
    # ==========================================
    strategy:
      matrix:
        account_index: [1, 2] 
      fail-fast: false # 允许其中一个账号失败时不影响其他账号运行

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get install -y google-chrome-stable

      - name: 🛡️ 生成并启动 sing-box 代理
        env:
          PROXY_STR: ${{ secrets.PROXY_STR }}
          SING_BOX_VERSION: 1.12.12
        run: |
          python generate_singbox_config.py
          wget https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz
          tar -xzf sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz
          chmod +x sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box
          echo "检查 sing-box 配置..."
          ./sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box check -c config.json
          echo "启动 sing-box 本地 mixed 代理..."
          nohup ./sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box run -c config.json > sing-box.log 2>&1 &
          sleep 3
          echo "测试本地代理连通性..."
          curl -x http://127.0.0.1:1080 https://api.ipify.org -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage xvfbwrapper requests SpeechRecognition pydub

      # ==========================================
      # 核心修改点：利用 context 动态将 secrets 的内容赋值给脚本
      # ==========================================
      - name: Run Renew Script
        env:
          RENEW_URL: ${{ secrets.RENEW_URL }}
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 关键：动态拼接出秘密的名称，如 ${{ secrets.VPS8_USERNAME_1 }}
          VPS8_USERNAME: ${{ secrets[format('VPS8_USERNAME_{0}', matrix.account_index)] }}
          VPS8_PASSWORD: ${{ secrets[format('VPS8_PASSWORD_{0}', matrix.account_index)] }}
          PROXY: http://127.0.0.1:1080
        run: python main.py

      - name: Upload Error Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshots-account-${{ matrix.account_index }}
          path: ./*.html
          retention-days: 5
